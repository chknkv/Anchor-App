[versions]
# Android-App
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

# Project
agp = "9.2.0"
androidx-activity = "1.13.0"
androidx-biometric = "1.1.0"
androidx-lifecycle = "2.10.0"
androidx-security = "1.1.0"
kotlin = "2.3.21"
kotlinStdlib = "2.3.21"

# Android Libraries
androidx-appcompat = "1.7.1"
androidx-core-ktx = "1.18.0"
androidx-splashscreen = "1.0.1"

# KMP Libraries
coroutines = "1.10.2"
datetime = "0.7.1"
navigation-compose = "2.9.2"
koin = "4.2.1"
serialization = "1.11.0"
ktor = "3.4.3"
sqldelight = "2.3.2"
multiplatformSettings = "1.3.0"
napier = "2.7.1"

# Compose Multiplatgorm
composeMultiplatform = "1.10.3"
foundation = "1.10.3"
material3 = "1.9.0"
resources = "1.10.3"
runtime = "1.10.3"
ui = "1.10.3"
kotlinTest = "2.3.20"
runner = "1.7.0"
core = "1.7.0"
junit = "1.3.0"

[libraries]

# Koin - DI
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# DateTime
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# SQLDelight
sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-primitive = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }

# Multiplatform Settings
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }

# Napier
napier = { module = "io.github.aakira:napier", version.ref = "napier" }

# Ktor
ktor-client-core                 = { module = "io.ktor:ktor-client-core",                 version.ref = "ktor" }
ktor-client-okhttp               = { module = "io.ktor:ktor-client-okhttp",               version.ref = "ktor" }
ktor-client-darwin               = { module = "io.ktor:ktor-client-darwin",               version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation",  version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json",  version.ref = "ktor" }
ktor-client-logging              = { module = "io.ktor:ktor-client-logging",              version.ref = "ktor" }
ktor-client-auth                 = { module = "io.ktor:ktor-client-auth",                 version.ref = "ktor" }
ktor-client-mock                 = { module = "io.ktor:ktor-client-mock",                 version.ref = "ktor" }

# Navigation Compose Multiplatform (JetBrains)
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# Koin ViewModel for Compose
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Compose Multiplatform
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "resources" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "foundation" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "runtime" }
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "ui" }
material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "composeMultiplatform" }

# Android Specific
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlinTest" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLint = { id = "com.android.lint", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
